name: Docker Image CI

on:
  push:
    branches: [ "master", "jdashel/build-and-publish-image" ]
  pull_request:
    branches: [ "master", "jdashel/build-and-publish-image" ]

jobs:

  build:

    runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/internetarchive/brozzler:latest

    - name: Push the image to github container registry
      run: docker push ghcr.io/internetarchive/brozzler:latest
