name: Docker Image CI

on:
  push:
    branches: [ "master", "jdashel/build-and-publish-image" ]
  pull_request:
    branches: [ "master", "jdashel/build-and-publish-image" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag brozzler:latest
